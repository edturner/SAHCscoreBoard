name: Update Scoreboard Data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Any date in the target weekend, YYYY-MM-DD (optional)"
        required: false
        default: ""
      end:
        description: "End date dd/mm/YYYY (optional)"
        required: false
        default: ""
  schedule:
    # Fixtures move fast on a Saturday and barely at all on a Sunday; league tables
    # only change once results are entered, so they run on their own slower cadence.
    - cron: '0 3 * * 4,5'     # Thu/Fri 03:00 UTC - pre-weekend build (fixtures + league)
    - cron: '*/5 8-21 * * 6'  # Saturday 08:00-21:59 UTC, every 5 min - live scores
    - cron: '0 * * * 0'       # Sunday, hourly
    - cron: '37 * * * 6,0'    # Sat/Sun, hourly at :37 - league tables only
                              # (:37 avoids the */5 grid; concurrency cancels in-progress runs)

jobs:
  update-data:
    runs-on: ubuntu-latest
    concurrency:
      group: scoreboard-data
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests

      - name: Update Scoreboard Data
        # Skipped on the league-only slot.
        if: github.event_name != 'schedule' || github.event.schedule != '37 * * * 6,0'
        env:
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python scripts/eh_api.py weekend --weekend "${{ github.event.inputs.start }}"
          else
            python scripts/eh_api.py weekend
          fi

      - name: Update League Data
        # Pre-weekend build and the hourly league slot only - not every 5 minutes.
        if: >-
          github.event_name != 'schedule'
          || github.event.schedule == '0 3 * * 4,5'
          || github.event.schedule == '37 * * * 6,0'
        env:
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
        run: |
          python scripts/eh_api.py league

      - name: Update Top Scorers
        # Every slot, including the Saturday five-minute one: goals should land as
        # fast as scores. Only today's fixtures are re-read each run (see the cache
        # rule in top_scorers.py), so this stays cheap. A failure here must never
        # stop the fixtures and league commit.
        continue-on-error: true
        env:
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
        run: |
          python scripts/top_scorers.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/scoreboard/weekend_fixtures.json data/scoreboard/mens_fixtures.csv data/scoreboard/womens_fixtures.csv || true
          git add data/league/teamData.json data/league/teamData.prev.json || true
          git add data/scorers/scorers.json data/scorers/fixture_goals.json || true
          git commit -m "Update scoreboard, league and scorer data [skip ci]" || echo "No changes"
          git push

