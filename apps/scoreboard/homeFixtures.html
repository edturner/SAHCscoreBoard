<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, user-scalable=no">
    <title>Home Fixtures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="../shared/styles.css">
</head>
<body class="board board--fixtures" data-side="home">
    <header class="head">
        <div class="pill"><span class="pill-dot"></span><span id="subtitle">This weekend</span></div>
        <h1 class="head-title">Home <em>fixtures</em></h1>
        <div class="head-rule"></div>
    </header>

    <main class="sheet">
        <section class="panel">
            <div class="panel-head">
                <span class="panel-strip"></span>
                <h2 class="panel-title">Men</h2>
                <span class="panel-note" id="M-note"></span>
            </div>
            <div class="panel-rows" id="fixtures-M"></div>
        </section>
        <section class="panel">
            <div class="panel-head">
                <span class="panel-strip"></span>
                <h2 class="panel-title">Women</h2>
                <span class="panel-note" id="F-note"></span>
            </div>
            <div class="panel-rows" id="fixtures-F"></div>
        </section>
    </main>

    <footer class="bar">
        <span class="bar-club"></span>
    </footer>

    <script src="../shared/board.js"></script>
    <script src="fixtures.js"></script>
</body>
</html>
